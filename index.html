<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app">
    <header class="top">
      <h1 data-text="heading"></h1>
    </header>

    <div class="timer" id="timer">
      <button type="button" class="timer-time" id="timer-time" data-title="timerSetMinutes">30:00</button>
      <span class="timer-status" id="timer-status"></span>
      <div class="timer-controls">
        <button type="button" id="timer-toggle" class="icon-btn">▶</button>
        <button type="button" id="timer-reset" class="icon-btn" data-title="timerResetButton">↺</button>
        <button type="button" id="timer-edit" class="icon-btn" data-title="timerSetMinutes">✎</button>
      </div>
    </div>

    <section class="stage" id="stage">
      <svg class="pointer" id="pointer" viewBox="0 0 60 70" aria-hidden="true">
        <path d="M30 68 L6 14 A26 26 0 0 1 54 14 Z" fill="#f6efe2" stroke="#8c1c13" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="30" cy="22" r="7" fill="#c0392b"/>
      </svg>
      <canvas id="wheel" data-aria-label="wheelLabel"></canvas>
    </section>

    <footer class="hint" id="hint">
      <span><kbd>▶</kbd> <span data-text="hintSpin"></span></span>
      <span><kbd>◀</kbd> <span data-text="hintDismiss"></span></span>
      <span><kbd>F</kbd> <span data-text="hintFullscreen"></span></span>
      <span><kbd>T</kbd> <span data-text="hintTimer"></span></span>
      <span><kbd>R</kbd> <span data-text="hintReset"></span></span>
      <span><kbd>E</kbd> <span data-text="hintEdit"></span></span>
      <span><kbd>M</kbd> <span data-text="hintSound"></span></span>
    </footer>

    <div class="corner">
      <button type="button" id="sound-btn" class="icon-btn">🔊</button>
      <button type="button" id="edit-btn" class="icon-btn" data-title="editActionsButton">⚙</button>
    </div>

    <button type="button" class="ui-toggle" id="ui-toggle" data-title="showHideControlsButton"><kbd>H</kbd> <span id="ui-toggle-label"></span></button>
  </main>

  <div class="result" id="result" hidden>
    <div class="result-card">
      <div class="result-kicker" data-text="resultKicker"></div>
      <div class="result-text" id="result-text"></div>
      <div class="result-details" id="result-details"></div>
      <div class="result-next" data-text="resultNext"></div>
    </div>
  </div>

  <div class="result gameover" id="gameover" hidden>
    <div class="result-card">
      <div class="result-kicker" data-text="gameoverKicker"></div>
      <div class="result-text" data-text="gameoverTitle"></div>
      <div class="result-details" data-text="gameoverDetails"></div>
      <div class="result-next" data-text="gameoverNext"></div>
    </div>
  </div>

  <div class="editor" id="timer-editor" hidden>
    <form class="editor-card timer-card" id="timer-form">
      <h2 data-text="timerEditorTitle"></h2>
      <p class="editor-help" data-text="timerEditorHelp"></p>
      <label class="timer-field">
        <input type="number" id="timer-minutes" min="1" max="600" step="1" required>
        <span data-text="timerEditorUnit"></span>
      </label>
      <p class="editor-error" id="timer-error"></p>
      <div class="editor-buttons">
        <span class="spacer"></span>
        <button type="button" id="timer-cancel" class="btn ghost" data-text="cancel"></button>
        <button type="submit" class="btn primary" data-text="save"></button>
      </div>
    </form>
  </div>

  <div class="editor" id="editor" hidden>
    <form class="editor-card" id="editor-form">
      <h2 data-text="actionsEditorTitle"></h2>
      <p class="editor-help" data-html="actionsEditorHelp"></p>
      <textarea id="editor-text" rows="10" spellcheck="true" wrap="off"></textarea>
      <p class="editor-error" id="editor-error"></p>
      <div class="editor-buttons">
        <button type="button" id="editor-reset" class="btn ghost" data-text="actionsEditorReset"></button>
        <span class="spacer"></span>
        <button type="button" id="editor-cancel" class="btn ghost" data-text="cancel"></button>
        <button type="submit" class="btn primary" data-text="save"></button>
      </div>
    </form>
  </div>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <script src="js/strings.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
